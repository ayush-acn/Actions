# Using the artifacts to store information

name: Artifacts - Testing
on: 
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: 
          go-version-file: go.mod
      - name: Install dependencies
        run: make setup

      - name: Test
        run: |
          # Run the test and store the output in a file
          got@stsum --jsonfile tests-output.json

      - name: Upload the test results
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.json

  verify-test:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Download the test results
        uses: actions/download-artifact@v4
        with:
          name: test-output
      - name: Verify result
        run: |
          # Retrive the test results
          cat test-output.json | jq 'select(.Action=="pass")'
          
